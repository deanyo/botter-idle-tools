<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Botter — Drop Tuning</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="portal.css">
<style>
  /* Drop-tuning specific layout. Shared palette + buttons in portal.css. */
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .spacer { flex: 1; }
  main {
    flex: 1; overflow: auto; padding: 24px; max-width: 900px; margin: 0 auto; width: 100%;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  section h2 { margin: 0 0 6px; color: var(--accent); font-size: 14px; }
  section .doc { color: var(--muted); font-size: 11px; margin-bottom: 14px; line-height: 1.5; }
  .slider-row {
    display: grid;
    grid-template-columns: 200px 1fr 90px 80px;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
  }
  .slider-row:last-child { border-bottom: none; }
  .slider-row label {
    font-size: 12px;
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    font-weight: normal;
  }
  .slider-row .help {
    grid-column: 2 / -1;
    font-size: 10px;
    color: var(--muted);
    padding-top: 2px;
    margin: 0;
  }
  .slider-row input[type="range"] { width: 100%; accent-color: var(--accent); }
  .slider-row .val {
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--accent);
    font-size: 12px;
  }
  .slider-row .raw {
    font-size: 10px;
    color: var(--muted);
    text-align: right;
  }
  #status { color: var(--muted); font-size: 11px; }
  #status.warn { color: var(--bad); }
</style>
</head>
<body>
<nav class="portal-nav" data-active="drops" data-title="Drop Rates"></nav>
<header>
  <span class="spacer"></span>
  <span id="status"></span>
  <button onclick="copyToClipboard()" title="Copy all drop rates as JSON">⧉ Copy JSON</button>
  <button class="primary" onclick="exportJSON()" title="Download all drop rates as a single JSON file">⬇ Export</button>
  <button onclick="resetToDefaults()">Reset</button>
</header>

<main id="root"></main>

<script>
const TUNING_PATH = "data/drop_tuning.json";

// Slider-row schema. Each entry drives a single tunable. The key
// path is dotted (e.g. "meta_rarity.primal_chance"); slider min/max
// is a sane editing band; format controls how the value renders.
const SLIDERS = [
  // Meta-rarity
  { section: "meta_rarity",
    title: "Meta-rarity",
    doc: "Independent of rarity tier. Stacks with quality + base rarity. Primal = +50% baseline, Ancient = +20% baseline. Affixes unaffected (have their own tier band).",
    rows: [
      { key: "primal_chance",  label: "Primal chance",  min: 0, max: 0.05,  step: 0.0005, fmt: "pct3" },
      { key: "ancient_chance", label: "Ancient chance", min: 0, max: 0.10,  step: 0.001,  fmt: "pct2" },
    ],
  },
  // Quality
  { section: "quality",
    title: "Quality tail",
    doc: "Separate multipliers for low-quality and high-quality tails. These override the legacy combined tail multiplier. 1.0 keeps the authored weights.",
    rows: [
      { key: "low_quality_tail_mult", label: "Low-quality tail ×", min: 0, max: 5.0, step: 0.05, fmt: "x" },
      { key: "high_quality_tail_mult", label: "High-quality tail ×", min: 0, max: 5.0, step: 0.05, fmt: "x" },
    ],
  },
  // Enchants
  { section: "enchant",
    title: "Enchants",
    doc: "global_chance_mult scales every item's authored enchant_chance — set to 0 to disable enchants globally. combo_chance is the secondary roll AFTER the first enchant lands; if it fires + the resulting pair has a registered combo, both flavors are replaced by the compound.",
    rows: [
      { key: "global_chance_mult", label: "Enchant chance ×", min: 0, max: 5.0, step: 0.05, fmt: "x" },
      { key: "combo_chance",       label: "Combo chance",     min: 0, max: 0.50, step: 0.005, fmt: "pct1" },
    ],
  },
  // Tint / recolor
  { section: "tint_recolor",
    title: "Tint / recolor",
    doc: "Per-instance hue/sat recolor rolls (drives item_recolor.gdshader). any_tint_chance is the cumulative chance of getting ANY tint; the rare-mode chances (shimmer/inverted/prismatic) are sub-bands within that.",
    rows: [
      { key: "any_tint_chance",  label: "Any tint chance",  min: 0, max: 1.0,   step: 0.01,   fmt: "pct1" },
      { key: "shimmer_chance",   label: "Shimmer chance",   min: 0, max: 0.10,  step: 0.001,  fmt: "pct2" },
      { key: "inverted_chance",  label: "Inverted chance",  min: 0, max: 0.05,  step: 0.0005, fmt: "pct3" },
      { key: "prismatic_chance", label: "Prismatic chance", min: 0, max: 0.02,  step: 0.0002, fmt: "pct3" },
    ],
  },
];

// Defaults — must match the GDScript fallbacks in DropTuning.gd.
const DEFAULTS = {
  meta_rarity: { primal_chance: 0.001, ancient_chance: 0.011 },
  quality:     { tail_weight_mult: 1.0, low_quality_tail_mult: 1.0, high_quality_tail_mult: 1.0 },
  enchant:     { global_chance_mult: 1.0, combo_chance: 0.03 },
  tint_recolor:{ any_tint_chance: 0.30, shimmer_chance: 0.005, inverted_chance: 0.001, prismatic_chance: 0.0005 },
};

let doc = JSON.parse(JSON.stringify(DEFAULTS));
let dataLoaded = false;
let loadedDefaults = null;
let dirty = false;

async function load() {
  try {
    const res = await fetch(TUNING_PATH);
    if (!res.ok) throw new Error("HTTP " + res.status);
    if (res.ok) {
      const parsed = await res.json();
      doc = parsed;
      dataLoaded = true;
      loadedDefaults = JSON.parse(JSON.stringify(parsed));
      // Merge fetched keys onto defaults so missing fields fall back.
      for (const sec of Object.keys(DEFAULTS)) {
        if (parsed[sec]) {
          doc[sec] = Object.assign({}, DEFAULTS[sec], parsed[sec]);
        }
      }
    }
  } catch (e) {
    setStatus("Couldn't load drop_tuning.json — export disabled. Reload to retry.", true);
  }
  render();
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  for (const section of SLIDERS) {
    const el = document.createElement("section");
    let html = `<h2>${section.title}</h2><div class="doc">${escapeHtml(section.doc)}</div>`;
    for (const row of section.rows) {
      const v = (doc[section.section] || {})[row.key];
      const cur = (v === undefined ? DEFAULTS[section.section][row.key] : v);
      html += `
        <div class="slider-row">
          <label>${row.label}</label>
          <input type="range" min="${row.min}" max="${row.max}" step="${row.step}" value="${cur}"
                 oninput="setKey('${section.section}','${row.key}',+this.value)">
          <span class="val" id="val-${section.section}-${row.key}">${formatVal(cur, row.fmt)}</span>
          <span class="raw">raw ${cur}</span>
        </div>
      `;
    }
    el.innerHTML = html;
    root.appendChild(el);
  }
  renderRarityBands(root);
}

function setKey(section, key, val) {
  if (!doc[section]) doc[section] = {};
  doc[section][key] = val;
  dirty = true;
  // Update the val + raw spans inline without re-rendering.
  const valEl = document.getElementById(`val-${section}-${key}`);
  if (valEl) {
    const fmt = lookupFmt(section, key);
    valEl.textContent = formatVal(val, fmt);
    if (valEl.nextElementSibling) valEl.nextElementSibling.textContent = `raw ${val}`;
  }
  setStatus("● unsaved");
}

function lookupFmt(section, key) {
  for (const s of SLIDERS) {
    if (s.section !== section) continue;
    for (const r of s.rows) if (r.key === key) return r.fmt;
  }
  return "raw";
}

function formatVal(v, fmt) {
  switch (fmt) {
    case "pct1":  return (v * 100).toFixed(1) + "%";
    case "pct2":  return (v * 100).toFixed(2) + "%";
    case "pct3":  return (v * 100).toFixed(3) + "%";
    case "x":     return v.toFixed(2) + "×";
    default:      return String(v);
  }
}


function renderRarityBands(root) {
  const bands = doc.tier_drop_band;
  if (!bands) return;
  const section = document.createElement('section');
  const rarities = ['common','uncommon','rare','epic','legendary'];
  section.innerHTML = '<h2>Tier rarity weights</h2><p class="doc">Relative weights for ordinary drops by source tier and floor band. Each row must have a positive total. Boss/elite steps and the trash ceiling are applied by the game afterwards.</p>';
  for (const tier of ['T1','T2','T3','T4','T5']) for (const floor of ['1-3','4-6']) {
    const weights = bands[tier]?.[floor]; if (!Array.isArray(weights)) continue;
    const row = document.createElement('fieldset'); row.style = 'border:1px solid var(--border);margin:12px 0;padding:12px;display:flex;flex-wrap:wrap;gap:12px';
    const legend = document.createElement('legend'); legend.textContent = tier + ' · Floors ' + floor; row.append(legend);
    rarities.forEach((rarity,index) => {
      const label = document.createElement('label'); label.textContent = rarity + ' ';
      const input = document.createElement('input'); input.type = 'number'; input.min = '0'; input.step = '1'; input.value = weights[index];
      input.dataset.band = tier + '/' + floor + '/' + rarity; input.style.width = '70px';
      input.addEventListener('input', () => { bands[tier][floor][index] = input.value === '' ? null : Number(input.value); dirty = true; });
      label.append(input); row.append(label);
    });
    section.append(row);
  }
  for (const key of ['boss_step','elite_step']) {
    const label = document.createElement('label'); label.textContent = key.replaceAll('_',' ') + ' ';
    const input = document.createElement('input'); input.type = 'number'; input.min = '0'; input.step = '1'; input.value = bands[key];
    input.addEventListener('input', () => { bands[key] = input.value === '' ? null : Number(input.value); dirty = true; }); label.append(input); section.append(label);
  }
  const label = document.createElement('label'); label.textContent = ' Trash rarity ceiling ';
  const select = document.createElement('select');
  for (const rarity of rarities) { const option = document.createElement('option'); option.value = rarity; option.textContent = rarity; select.append(option); }
  select.value = bands.trash_ceiling; select.addEventListener('change', () => {bands.trash_ceiling = select.value; dirty = true;}); label.append(select); section.append(label);
  root.append(section);
}
function validBands() {
  const bands = doc.tier_drop_band; if (!bands) return true;
  for (const tier of ['T1','T2','T3','T4','T5']) for (const floor of ['1-3','4-6']) {
    const weights = bands[tier]?.[floor]; if (!weights) continue;
    if (!weights.every(v => Number.isInteger(v) && v >= 0) || weights.reduce((a,b) => a+b,0) <= 0) {
      setStatus('Check rarity weights for ' + tier + ' / ' + floor + ': nonnegative integers with a positive total required.', true); return false;
    }
  }
  if (!['boss_step','elite_step'].every(k => Number.isInteger(bands[k]) && bands[k] >= 0)) { setStatus('Boss and elite steps must be nonnegative integers.', true); return false; }
  return true;
}

function exportJSON() {
  if (!validBands()) return;
  if (!dataLoaded) return setStatus("Load current data before exporting.", true);
  const out = Object.assign(
    { _doc: "Drop tuning — edit via tools/drop_tuning.html. Runtime reads in DropTuning.gd; missing keys fall back to hardcoded defaults.", _format_version: 1 },
    doc,
  );
  const json = JSON.stringify(out, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "drop_tuning.json";
  a.click();
  URL.revokeObjectURL(url);
  setStatus("Exported drop_tuning.json — drop into data/");
}

async function copyToClipboard() {
  if (!validBands()) return;
  if (!dataLoaded) return setStatus("Load current data before copying.", true);
  const out = Object.assign(
    { _doc: "Drop tuning — edited via tools/drop_tuning.html.", _format_version: 1 },
    doc,
  );
  const json = JSON.stringify(out, null, 2);
  try {
    await navigator.clipboard.writeText(json);
    setStatus("Copied JSON to clipboard.");
  } catch (e) {
    setStatus("Clipboard write blocked — use ⬇ Export instead.", true);
  }
}

function resetToDefaults() {
  if (!dataLoaded) return setStatus("Load current data before resetting.", true);
  if (!confirm("Reset all values to the data loaded when this page opened?")) return;
  doc = JSON.parse(JSON.stringify(loadedDefaults));
  dirty = true;
  setStatus("Reset to loaded values.");
  render();
}

function setStatus(msg, warn = false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = warn ? "warn" : "";
  if (msg && !warn) setTimeout(() => {
    if (el.textContent === msg) el.textContent = "";
  }, 3000);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

load();
</script>
<script src="portal_nav.js" defer></script>
</body>
</html>
